services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: bastion123
      MYSQL_DATABASE: bastion
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ../schema/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_DSN: "root:bastion123@tcp(db:3306)/bastion?parseTime=true"
      ENCRYPTION_KEY: "bastion-dev-key-32bytes-long!!"
      JWT_SECRET: "bastion-jwt-secret-key"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
